name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # dev/test tools
          pip install pytest-cov flake8

      - name: Run linter (flake8)
        run: |
          # show lint errors and fail on issues
          flake8 .

      - name: Run tests with coverage
        run: |
          # collect coverage and print a terminal summary and XML report
          python -m pytest --maxfail=1 --disable-warnings -q --cov=./ --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml
